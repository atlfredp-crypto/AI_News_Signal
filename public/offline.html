<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e0e0c" />
    <title>Signal</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100dvh;
        background: #0e0e0c;
        color: #f0ece4;
        font-family: "Source Sans 3", ui-sans-serif, system-ui, sans-serif;
      }
      main {
        max-width: 28rem;
        margin: 0 auto;
        padding: max(3rem, env(safe-area-inset-top)) 1.5rem 2rem;
      }
      h1 {
        font-family: Newsreader, ui-serif, Georgia, serif;
        font-size: 2.4rem;
        letter-spacing: -0.04em;
        margin: 0 0 0.75rem;
      }
      p {
        color: #9c9890;
        line-height: 1.5;
        margin: 0 0 1.5rem;
      }
      a {
        color: #f0ece4;
        text-decoration: none;
        border-bottom: 1px solid rgb(240 236 228 / 0.4);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Signal</h1>
      <p>オフラインです。接続できたら、もう一度開いてください。</p>
      <a href="/">再読み込み</a>
    </main>

</html>
